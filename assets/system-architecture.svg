    <path d="M300 355H400" stroke="#147D64" stroke-width="5" marker-end="url(#arrow)"/>
    <g transform="translate(420,180)" filter="url(#s)"><rect width="420" height="350" rx="24" fill="#FFFFFF" stroke="#CFE1DC"/><rect width="420" height="68" rx="24" fill="#142B3B"/><rect y="48" width="420" height="20" fill="#142B3B"/><text x="210" y="43" fill="#FFFFFF" font-size="22" font-weight="700">STREAMLIT APPLICATION</text><g transform="translate(30,97)"><rect width="360" height="64" rx="13" fill="#E5F5EE"/><text x="180" y="28" fill="#17584C" font-size="18" font-weight="700">Application Interface</text><text x="180" y="49" fill="#57766E" font-size="14">Forms · dashboards · record search</text></g><g transform="translate(30,176)"><rect width="360" height="64" rx="13" fill="#EDF3F5"/><text x="180" y="28" fill="#142B3B" font-size="18" font-weight="700">Authentication &amp; Permissions</text><text x="180" y="49" fill="#607681" font-size="14">General access · administrator gate</text></g><g transform="translate(30,255)"><rect width="360" height="64" rx="13" fill="#FFF7E7"/><text x="180" y="28" fill="#755516" font-size="18" font-weight="700">Financial Business Logic</text><text x="180" y="49" fill="#806E47" font-size="14">Validation · balances · totals · status</text></g></g>
