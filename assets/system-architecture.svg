  <g transform="translate(260,630)" font-family="Arial, sans-serif"><rect width="1080" height="148" rx="24" fill="#142B3B"/><text x="540" y="38" text-anchor="middle" fill="#D7A64A" font-size="15" font-weight="700" letter-spacing="2">CURRENT DEPLOYMENT PATH</text><g fill="#FFFFFF" font-size="18" text-anchor="middle"><text x="125" y="93">Browser</text><text x="352" y="93">HTTPS</text><text x="555" y="93">Nginx</text><text x="772" y="93">Streamlit</text><text x="970" y="93">SQLite</text></g><g stroke="#55B99A" stroke-width="4" marker-end="url(#arrow)"><path d="M185 87h87"/><path d="M414 87h73"/><path d="M620 87h80"/><path d="M840 87h62"/></g><text x="540" y="125" text-anchor="middle" fill="#9FC2B8" font-size="14">Single-process Python application · local file-based persistence · no external payment API</text></g>
  <text x="800" y="844" text-anchor="middle" fill="#667B85" font-family="Arial, sans-serif" font-size="15">Architecture reflects the verified implementation; no cloud services, microservices or bank integrations are implied.</text>
