<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Verified Harvest system architecture</title><desc id="desc">Users connect through HTTPS and Nginx to a Streamlit application with authentication, financial business rules, SQLite storage and reporting exports.</desc>
  <defs><linearGradient id="head" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142B3B"/><stop offset="1" stop-color="#17584C"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="11" flood-opacity=".13"/></filter><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#147D64"/></marker></defs>
  <rect width="1600" height="900" rx="28" fill="#F7FAFA"/><rect width="1600" height="116" rx="28" fill="url(#head)"/><rect y="88" width="1600" height="28" fill="#17584C"/><text x="800" y="55" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="39" font-weight="700">VERIFIED SYSTEM ARCHITECTURE</text><text x="800" y="88" text-anchor="middle" fill="#BDE2D6" font-family="Arial, sans-serif" font-size="17">A focused, locally hosted financial workflow application</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
