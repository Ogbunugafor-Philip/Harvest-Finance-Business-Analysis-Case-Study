<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Before and after business transformation</title>
  <desc id="desc">A comparison between user-reported financial administration challenges and verified digital capabilities.</desc>
  <defs><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142B3B"/><stop offset="1" stop-color="#1D4053"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/></filter></defs>
  <rect width="1600" height="900" rx="28" fill="#FAFBFC"/>
  <text x="800" y="72" text-anchor="middle" fill="#142B3B" font-family="Georgia, serif" font-size="40" font-weight="700">FROM OPERATIONAL CHALLENGE TO DIGITAL CONTROL</text>
  <text x="800" y="110" text-anchor="middle" fill="#617682" font-family="Arial, sans-serif" font-size="18">User-reported context compared with verified system capability</text>
  <g transform="translate(80,155)" filter="url(#s)"><rect width="610" height="650" rx="26" fill="#FFFFFF" stroke="#D7DEE2"/><rect width="610" height="94" rx="26" fill="#EEF1F3"/><rect y="70" width="610" height="24" fill="#EEF1F3"/><circle cx="62" cy="47" r="20" fill="#B66A64"/><path d="M52 37l20 20M72 37L52 57" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="102" y="44" fill="#34495E" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">BEFORE DIGITAL TRANSFORMATION</text><text x="102" y="68" fill="#71818A" font-family="Arial, sans-serif" font-size="14">Reported operational challenges</text>
    <g font-family="Arial, sans-serif"><g transform="translate(42,132)"><rect width="526" height="82" rx="14" fill="#F7F2F1"/><path d="M28 24h38v34H28zM33 18h28v8H33z" fill="none" stroke="#A75B56" stroke-width="3"/><text x="88" y="35" fill="#34495E" font-size="19" font-weight="700">Fragmented financial records</text><text x="88" y="59" fill="#6D7B83" font-size="15">Information was difficult to organise consistently.</text></g>
    <g transform="translate(42,230)"><rect width="526" height="82" rx="14" fill="#F7F2F1"/><path d="M29 20h35v40H29zM36 29h21M36 38h21M36 47h14" stroke="#A75B56" stroke-width="3" fill="none"/><text x="88" y="35" fill="#34495E" font-size="19" font-weight="700">Difficult reconciliation</text><text x="88" y="59" fill="#6D7B83" font-size="15">Consolidating financial activity required significant effort.</text></g>
    <g transform="translate(42,328)"><rect width="526" height="82" rx="14" fill="#F7F2F1"/><circle cx="47" cy="40" r="19" fill="none" stroke="#A75B56" stroke-width="3"/><path d="M47 28v14l10 6" stroke="#A75B56" stroke-width="3" fill="none"/><text x="88" y="35" fill="#34495E" font-size="19" font-weight="700">Manual tracking challenges</text><text x="88" y="59" fill="#6D7B83" font-size="15">Pledges and redemptions were harder to follow.</text></g>
    <g transform="translate(42,426)"><rect width="526" height="82" rx="14" fill="#F7F2F1"/><path d="M27 57V35h12v22m7 0V25h12v32m7 0V43h12v14" stroke="#A75B56" stroke-width="3" fill="none"/><text x="88" y="35" fill="#34495E" font-size="19" font-weight="700">Limited financial visibility</text><text x="88" y="59" fill="#6D7B83" font-size="15">Decision-makers lacked a consolidated current view.</text></g>
    <g transform="translate(42,524)"><rect width="526" height="82" rx="14" fill="#F7F2F1"/><path d="M29 22h34v36H29zM35 30h22M35 39h16M35 48h19" stroke="#A75B56" stroke-width="3" fill="none"/><text x="88" y="35" fill="#34495E" font-size="19" font-weight="700">Record reliability challenges</text><text x="88" y="59" fill="#6D7B83" font-size="15">Consistent administration needed stronger structure.</text></g></g>
  </g>
  <g transform="translate(738,423)"><circle cx="62" cy="28" r="62" fill="#D7A64A"/><path d="M31 28h57M70 9l19 19-19 19" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(910,155)" filter="url(#s)"><rect width="610" height="650" rx="26" fill="#FFFFFF" stroke="#B9DACE"/><rect width="610" height="94" rx="26" fill="url(#navy)"/><rect y="70" width="610" height="24" fill="#1D4053"/><circle cx="62" cy="47" r="20" fill="#147D64"/><path d="M51 47l8 8 15-18" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/><text x="102" y="44" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">AFTER DIGITAL TRANSFORMATION</text><text x="102" y="68" fill="#B9DACE" font-family="Arial, sans-serif" font-size="14">Verified digital capabilities</text>
    <g font-family="Arial, sans-serif"><g transform="translate(42,116)"><rect width="526" height="70" rx="14" fill="#E5F5EE"/><circle cx="47" cy="35" r="20" fill="#147D64"/><path d="M37 29h20v16H37zM41 24h12v6" fill="none" stroke="#fff" stroke-width="2.5"/><text x="88" y="32" fill="#17584C" font-size="19" font-weight="700">Centralised records</text><text x="88" y="53" fill="#52746B" font-size="14">One structured financial data store.</text></g>
    <g transform="translate(42,199)"><rect width="526" height="70" rx="14" fill="#E5F5EE"/><circle cx="47" cy="35" r="20" fill="#147D64"/><path d="M35 35h24M47 23v24" stroke="#fff" stroke-width="3"/><text x="88" y="32" fill="#17584C" font-size="19" font-weight="700">Structured pledge management</text><text x="88" y="53" fill="#52746B" font-size="14">Creation, search, redemption and balance tracking.</text></g>
    <g transform="translate(42,282)"><rect width="526" height="70" rx="14" fill="#E5F5EE"/><circle cx="47" cy="35" r="20" fill="#147D64"/><path d="M35 42l8-9 8 5 10-14" stroke="#fff" stroke-width="3" fill="none"/><text x="88" y="32" fill="#17584C" font-size="19" font-weight="700">Automated calculations</text><text x="88" y="53" fill="#52746B" font-size="14">Balances, totals, collection rate and net position.</text></g>
    <g transform="translate(42,365)"><rect width="526" height="70" rx="14" fill="#E5F5EE"/><circle cx="47" cy="35" r="20" fill="#147D64"/><rect x="34" y="24" width="26" height="22" rx="2" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M39 40v-6m7 6V28m7 12v-9" stroke="#fff" stroke-width="2.5"/><text x="88" y="32" fill="#17584C" font-size="19" font-weight="700">Management visibility</text><text x="88" y="53" fill="#52746B" font-size="14">Dashboards, statuses and programme analysis.</text></g>
    <g transform="translate(42,448)"><rect width="526" height="70" rx="14" fill="#E5F5EE"/><circle cx="47" cy="35" r="20" fill="#147D64"/><path d="M35 25h24v20H35zM40 31h14M40 37h14" stroke="#fff" stroke-width="2.5" fill="none"/><text x="88" y="32" fill="#17584C" font-size="19" font-weight="700">Consolidated reporting</text><text x="88" y="53" fill="#52746B" font-size="14">CSV datasets and multi-sheet Excel statements.</text></g>
    <g transform="translate(42,531)"><rect width="526" height="70" rx="14" fill="#E5F5EE"/><circle cx="47" cy="35" r="20" fill="#D7A64A"/><path d="M35 35l8 8 16-19" stroke="#fff" stroke-width="3" fill="none"/><text x="88" y="32" fill="#17584C" font-size="19" font-weight="700">Reconciliation support</text><text x="88" y="53" fill="#52746B" font-size="14">Accessible source records and consistent summaries.</text></g></g>
  </g>
  <text x="800" y="855" text-anchor="middle" fill="#6A7C85" font-family="Arial, sans-serif" font-size="15">No quantified improvement is claimed; the “before” reflects user-reported business context.</text>
</svg>
