<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850" role="img" aria-labelledby="title desc">
  <title id="title">Business value enabled by the Harvest system</title><desc id="desc">Six verified capability areas surrounding a central digital financial administration outcome.</desc>
  <defs><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142B3B"/><stop offset="1" stop-color="#147D64"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".13"/></filter></defs>
  <rect width="1600" height="850" rx="28" fill="#FAFBFC"/><text x="800" y="70" text-anchor="middle" fill="#142B3B" font-family="Georgia, serif" font-size="40" font-weight="700">BUSINESS VALUE ENABLED</text><text x="800" y="106" text-anchor="middle" fill="#687C86" font-family="Arial, sans-serif" font-size="17">Practical capability value — no unverified performance percentages</text>
  <g stroke="#B9DACE" stroke-width="4" fill="none"><path d="M800 420L425 230M800 420l375-190M800 420L425 420M800 420h375M800 420L425 610M800 420l375 190"/></g>
  <g transform="translate(610,280)" filter="url(#s)"><circle cx="190" cy="140" r="153" fill="url(#core)"/><circle cx="190" cy="140" r="126" fill="none" stroke="#FFFFFF" stroke-opacity=".15" stroke-width="2"/><path d="M145 150V99h31v51m14 0V72h31v78m14 0v-35h31v35" stroke="#D7A64A" stroke-width="8" fill="none"/><text x="190" y="203" text-anchor="middle" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="700">STRUCTURED DIGITAL</text><text x="190" y="230" text-anchor="middle" fill="#BDE2D6" font-family="Arial, sans-serif" font-size="18">FINANCIAL ADMINISTRATION</text></g>
  <g font-family="Arial, sans-serif" filter="url(#s)">
    <g transform="translate(125,155)"><rect width="395" height="145" rx="22" fill="#FFFFFF" stroke="#CFE1DC"/><circle cx="58" cy="57" r="29" fill="#E5F5EE"/><path d="M42 63l12-13 10 8 14-20" stroke="#147D64" stroke-width="4" fill="none"/><text x="103" y="49" fill="#142B3B" font-size="20" font-weight="700">Financial Visibility</text><text x="103" y="77" fill="#607681" font-size="14">Current totals, collection status</text><text x="103" y="99" fill="#607681" font-size="14">and outstanding obligations.</text></g>
    <g transform="translate(1080,155)"><rect width="395" height="145" rx="22" fill="#FFFFFF" stroke="#CFE1DC"/><circle cx="58" cy="57" r="29" fill="#E5F5EE"/><path d="M43 43h30v29H43zM49 36h18v8" stroke="#147D64" stroke-width="3" fill="none"/><text x="103" y="49" fill="#142B3B" font-size="20" font-weight="700">Structured Records</text><text x="103" y="77" fill="#607681" font-size="14">Consistent contributor, pledge,</text><text x="103" y="99" fill="#607681" font-size="14">levy and expense information.</text></g>
    <g transform="translate(75,348)"><rect width="395" height="145" rx="22" fill="#FFFFFF" stroke="#CFE1DC"/><circle cx="58" cy="57" r="29" fill="#FFF4D9"/><path d="M45 42h26v30H45M50 49h16M50 56h16M50 63h11" stroke="#B17E1B" stroke-width="3" fill="none"/><text x="103" y="49" fill="#142B3B" font-size="20" font-weight="700">Process Standardisation</text><text x="103" y="77" fill="#607681" font-size="14">Controlled categories and repeatable</text><text x="103" y="99" fill="#607681" font-size="14">capture workflows.</text></g>
    <g transform="translate(1130,348)"><rect width="395" height="145" rx="22" fill="#FFFFFF" stroke="#CFE1DC"/><circle cx="58" cy="57" r="29" fill="#FFF4D9"/><text x="58" y="66" text-anchor="middle" fill="#B17E1B" font-size="27" font-weight="700">Σ</text><text x="103" y="49" fill="#142B3B" font-size="20" font-weight="700">Automated Calculations</text><text x="103" y="77" fill="#607681" font-size="14">Balances, totals, rates and net</text><text x="103" y="99" fill="#607681" font-size="14">position calculated consistently.</text></g>
    <g transform="translate(125,555)"><rect width="395" height="145" rx="22" fill="#FFFFFF" stroke="#CFE1DC"/><circle cx="58" cy="57" r="29" fill="#E5F5EE"/><path d="M42 43h32v27H42zM47 50h22M47 57h15" stroke="#147D64" stroke-width="3" fill="none"/><text x="103" y="49" fill="#142B3B" font-size="20" font-weight="700">Management Reporting</text><text x="103" y="77" fill="#607681" font-size="14">Dashboards and standardized</text><text x="103" y="99" fill="#607681" font-size="14">downloadable statements.</text></g>
    <g transform="translate(1080,555)"><rect width="395" height="145" rx="22" fill="#FFFFFF" stroke="#CFE1DC"/><circle cx="58" cy="57" r="29" fill="#E5F5EE"/><path d="M43 57l10 10 20-28" stroke="#147D64" stroke-width="4" fill="none"/><text x="103" y="49" fill="#142B3B" font-size="20" font-weight="700">Reconciliation Support</text><text x="103" y="77" fill="#607681" font-size="14">Accessible source records and</text><text x="103" y="99" fill="#607681" font-size="14">consolidated financial views.</text></g>
  </g>
  <text x="800" y="790" text-anchor="middle" fill="#667B85" font-family="Arial, sans-serif" font-size="15">Value statements describe enabled capabilities; measured operational outcomes have not been independently established.</text>
</svg>
