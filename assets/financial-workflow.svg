<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Harvest financial workflow</title><desc id="desc">A verified workflow from financial record capture through validation, pledge tracking, reporting and management review.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142B3B"/><stop offset="1" stop-color="#17584C"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#06151C" flood-opacity=".22"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#D7A64A"/></marker></defs>
  <rect width="1600" height="700" rx="28" fill="url(#bg)"/><text x="800" y="65" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, serif" font-size="40" font-weight="700">FINANCIAL WORKFLOW</text><text x="800" y="100" text-anchor="middle" fill="#BDE2D6" font-family="Arial, sans-serif" font-size="17">Human verification supported by automated validation, calculation and reporting</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" filter="url(#s)">
    <g transform="translate(75,190)"><rect width="235" height="250" rx="24" fill="#FAFBFC"/><circle cx="117" cy="66" r="34" fill="#E5F5EE"/><path d="M95 72h44M117 50v44" stroke="#147D64" stroke-width="5"/><text x="117" y="131" fill="#142B3B" font-size="20" font-weight="700">1 · Record Capture</text><text x="117" y="166" fill="#607681" font-size="14">Contributor details</text><text x="117" y="189" fill="#607681" font-size="14">Programme and amount</text><text x="117" y="212" fill="#607681" font-size="14">Payment mode</text></g>
    <g transform="translate(380,190)"><rect width="235" height="250" rx="24" fill="#FAFBFC"/><circle cx="117" cy="66" r="34" fill="#E5F5EE"/><path d="M97 67l13 13 27-34" fill="none" stroke="#147D64" stroke-width="5" stroke-linecap="round"/><text x="117" y="131" fill="#142B3B" font-size="20" font-weight="700">2 · Validation</text><text x="117" y="166" fill="#607681" font-size="14">Required fields</text><text x="117" y="189" fill="#607681" font-size="14">Controlled categories</text><text x="117" y="212" fill="#607681" font-size="14">Positive amounts</text></g>
    <g transform="translate(685,190)"><rect width="235" height="250" rx="24" fill="#FAFBFC"/><circle cx="117" cy="66" r="34" fill="#FFF4D9"/><path d="M95 61h44M95 73h44M110 49v37" stroke="#B17E1B" stroke-width="4"/><text x="117" y="131" fill="#142B3B" font-size="20" font-weight="700">3 · Payment State</text><text x="117" y="166" fill="#607681" font-size="14">Cash / Transfer paid</text><text x="117" y="189" fill="#607681" font-size="14">Pledge outstanding</text><text x="117" y="212" fill="#607681" font-size="14">Partial redemption</text></g>
    <g transform="translate(990,190)"><rect width="235" height="250" rx="24" fill="#FAFBFC"/><circle cx="117" cy="66" r="34" fill="#E5F5EE"/><path d="M96 82V61h13v21m8 0V48h13v34m8 0V55h13v27" stroke="#147D64" stroke-width="4" fill="none"/><text x="117" y="131" fill="#142B3B" font-size="20" font-weight="700">4 · Calculation</text><text x="117" y="166" fill="#607681" font-size="14">Outstanding balance</text><text x="117" y="189" fill="#607681" font-size="14">Collection rate</text><text x="117" y="212" fill="#607681" font-size="14">Income less expenses</text></g>
    <g transform="translate(1295,190)"><rect width="235" height="250" rx="24" fill="#FAFBFC"/><circle cx="117" cy="66" r="34" fill="#FFF4D9"/><path d="M96 48h42v39H96zM104 59h26M104 68h26M104 77h17" fill="none" stroke="#B17E1B" stroke-width="3"/><text x="117" y="131" fill="#142B3B" font-size="20" font-weight="700">5 · Reporting</text><text x="117" y="166" fill="#607681" font-size="14">Financial dashboard</text><text x="117" y="189" fill="#607681" font-size="14">CSV / Excel outputs</text><text x="117" y="212" fill="#607681" font-size="14">Management review</text></g>
  </g>
  <g stroke="#D7A64A" stroke-width="5" marker-end="url(#a)"><path d="M310 315h54"/><path d="M615 315h54"/><path d="M920 315h54"/><path d="M1225 315h54"/></g>
  <g transform="translate(245,520)" font-family="Arial, sans-serif"><rect width="1110" height="94" rx="20" fill="#FFFFFF" opacity=".1" stroke="#76BFAA"/><text x="555" y="37" text-anchor="middle" fill="#D7A64A" font-size="15" font-weight="700" letter-spacing="2">PARALLEL FINANCIAL FLOWS</text><text x="555" y="69" text-anchor="middle" fill="#E1EEEA" font-size="18">Compulsory levies and approved expenses feed the same consolidated financial position.</text></g>
</svg>
